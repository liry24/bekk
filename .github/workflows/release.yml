name: 'Release: Build, Publish & Deploy'

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    name: Check release tag
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get release tag
        id: get-tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(jq -r '.version' package.json)"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, skipping"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

  build-core:
    name: Build bekk-core binaries
    needs: check
    if: needs.check.outputs.tag != ''
    uses: ./.github/workflows/build-core.yml

  build:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: [check, build-core]
    if: needs.check.outputs.tag != ''
    outputs:
      windows-zip-hash: ${{ steps.hashes.outputs.windows }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build npm packages (all platforms)
        run: bun run package

      - name: Download bekk-core Windows binary
        uses: actions/download-artifact@v5
        with:
          name: bekk-core-x86_64-pc-windows-msvc
          path: dist/npm/windows-x64/bin/

      - name: Download bekk-core Linux binary
        uses: actions/download-artifact@v5
        with:
          name: bekk-core-x86_64-unknown-linux-gnu
          path: dist/npm/linux-x64/bin/

      - name: Download bekk-core macOS x64 binary
        uses: actions/download-artifact@v5
        with:
          name: bekk-core-x86_64-apple-darwin
          path: dist/npm/darwin-x64/bin/

      - name: Download bekk-core macOS ARM64 binary
        uses: actions/download-artifact@v5
        with:
          name: bekk-core-aarch64-apple-darwin
          path: dist/npm/darwin-arm64/bin/

      - name: Make bekk Unix binaries executable
        run: |
          chmod +x dist/npm/linux-x64/bin/bekk-bun-linux-x64-baseline || true
          chmod +x dist/npm/darwin-x64/bin/bekk-bun-darwin-x64 || true
          chmod +x dist/npm/darwin-arm64/bin/bekk-bun-darwin-arm64 || true
          chmod +x dist/npm/linux-x64/bin/bekk-core-linux-x64 || true
          chmod +x dist/npm/darwin-x64/bin/bekk-core-macos-x64 || true
          chmod +x dist/npm/darwin-arm64/bin/bekk-core-macos-arm64 || true

      - name: Create release zip archives
        run: |
          mkdir -p release

          # Windows x64
          cp dist/npm/windows-x64/bin/bekk-bun-windows-x64-baseline.exe /tmp/bekk.exe
          cp dist/npm/windows-x64/bin/bekk-core-windows-x64.exe /tmp/bekk-core.exe
          cd /tmp && zip $OLDPWD/release/bekk-windows-x64.zip bekk.exe bekk-core.exe && cd $OLDPWD
          rm /tmp/bekk.exe /tmp/bekk-core.exe

          # Linux x64
          cp dist/npm/linux-x64/bin/bekk-bun-linux-x64-baseline /tmp/bekk
          cp dist/npm/linux-x64/bin/bekk-core-linux-x64 /tmp/bekk-core
          cd /tmp && zip $OLDPWD/release/bekk-linux-x64.zip bekk bekk-core && cd $OLDPWD
          rm /tmp/bekk /tmp/bekk-core

          # macOS x64
          cp dist/npm/darwin-x64/bin/bekk-bun-darwin-x64 /tmp/bekk
          cp dist/npm/darwin-x64/bin/bekk-core-macos-x64 /tmp/bekk-core
          cd /tmp && zip $OLDPWD/release/bekk-macos-x64.zip bekk bekk-core && cd $OLDPWD
          rm /tmp/bekk /tmp/bekk-core

          # macOS ARM64
          cp dist/npm/darwin-arm64/bin/bekk-bun-darwin-arm64 /tmp/bekk
          cp dist/npm/darwin-arm64/bin/bekk-core-macos-arm64 /tmp/bekk-core
          cd /tmp && zip $OLDPWD/release/bekk-macos-arm64.zip bekk bekk-core && cd $OLDPWD
          rm /tmp/bekk /tmp/bekk-core

      - name: Compute zip hashes
        id: hashes
        run: |
          echo "windows=$(sha256sum release/bekk-windows-x64.zip | awk '{ print $1 }')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          files: release/*.zip
          generate_release_notes: true

      - name: Upload dist artifact
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish-npm:
    name: Publish to npm
    needs: [check, build]
    runs-on: ubuntu-latest
    if: needs.check.outputs.tag != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download dist artifact
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Publish to npm
        run: bun run publish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-scoop:
    name: Update Scoop bucket
    needs: [check, build]
    runs-on: ubuntu-latest
    if: needs.check.outputs.tag != ''

    steps:
      - name: Checkout Scoop bucket
        uses: actions/checkout@v6
        with:
          repository: liry24/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop-bucket

      - name: Update Scoop manifest
        run: |
          RELEASE_TAG="${{ needs.check.outputs.tag }}"
          VER="${RELEASE_TAG#v}"
          REPO="${{ github.repository }}"
          ZIP="bekk-windows-x64.zip"

          jq -n \
            --arg ver "$VER" \
            --arg url "https://github.com/$REPO/releases/download/$RELEASE_TAG/$ZIP" \
            --arg hash "${{ needs.build.outputs.windows-zip-hash }}" \
            --arg repo "$REPO" \
            --arg zip "$ZIP" \
            '{
              version: $ver,
              description: "Cross-platform backup CLI",
              homepage: ("https://github.com/" + $repo),
              architecture: {
                "64bit": {
                  url: $url,
                  hash: $hash,
                  bin: [["bekk.exe", "bekk"]],
                  shortcuts: [["bekk.exe", "bekk"]]
                }
              },
              checkver: { github: ("https://github.com/" + $repo) },
              autoupdate: {
                architecture: {
                  "64bit": {
                    url: ("https://github.com/" + $repo + "/releases/download/v$version/" + $zip)
                  }
                }
              }
            }' > scoop-bucket/bucket/bekk.json

          cd scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/bekk.json
          git diff --staged --quiet || git commit -m "chore: update bekk to $RELEASE_TAG"
          git push
