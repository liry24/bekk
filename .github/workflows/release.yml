name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    outputs:
      binary-hash: ${{ steps.binary.outputs.hash }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build npm packages
        run: bun run package

      - name: Compute Windows binary hash
        id: binary
        run: |
          BINARY="dist/npm/windows-x64/bin/bekk-bun-windows-x64-baseline.exe"
          echo "path=$BINARY" >> "$GITHUB_OUTPUT"
          echo "hash=$(sha256sum "$BINARY" | awk '{ print $1 }')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.binary.outputs.path }}
          generate_release_notes: true

      - name: Upload dist artifact
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download dist artifact
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Publish to npm
        run: bun run publish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-scoop:
    name: Update Scoop bucket
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Scoop bucket
        uses: actions/checkout@v6
        with:
          repository: liry24/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop-bucket

      - name: Update Scoop manifest
        run: |
          VER="${GITHUB_REF_NAME#v}"
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          BINARY="bekk-bun-windows-x64-baseline.exe"

          jq -n \
            --arg ver "$VER" \
            --arg url "https://github.com/$REPO/releases/download/$TAG/$BINARY" \
            --arg hash "${{ needs.build.outputs.binary-hash }}" \
            --arg repo "$REPO" \
            --arg bin "$BINARY" \
            '{
              version: $ver,
              description: "Backup CLI for Windows",
              homepage: ("https://github.com/" + $repo),
              architecture: { "64bit": { url: $url, hash: $hash } },
              bin: [[$bin, "bekk"]],
              checkver: { github: ("https://github.com/" + $repo) },
              autoupdate: {
                architecture: {
                  "64bit": {
                    url: ("https://github.com/" + $repo + "/releases/download/v$version/" + $bin)
                  }
                }
              }
            }' > scoop-bucket/bucket/bekk.json

          cd scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/bekk.json
          git diff --staged --quiet || git commit -m "chore: update bekk to $TAG"
          git push
