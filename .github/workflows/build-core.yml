name: 'Build: bekk-core Binaries'

on:
  workflow_call:
    outputs:
      artifact-name:
        description: Name of the uploaded artifact
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    outputs:
      artifact-name: bekk-core-binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: bekk-core-windows-x64.exe
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: bekk-core-linux-x64
          - name: macOS x64
            os: macos-latest
            target: x86_64-apple-darwin
            bin: bekk-core-macos-x64
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: bekk-core-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bekk-core

      - name: Build bekk-core
        working-directory: bekk-core
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release --target ${{ matrix.target }}

      - name: Create output dir
        run: mkdir -p bekk-core-binaries
        shell: bash

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp bekk-core/target/${{ matrix.target }}/release/bekk-core \
             bekk-core-binaries/${{ matrix.bin }}
        shell: bash

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force bekk-core-binaries | Out-Null
          Copy-Item "bekk-core\target\${{ matrix.target }}\release\bekk-core.exe" `
                    "bekk-core-binaries\${{ matrix.bin }}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: bekk-core-${{ matrix.target }}
          path: bekk-core-binaries/${{ matrix.bin }}
          if-no-files-found: error
