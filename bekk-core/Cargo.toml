[package]
name = "bekk-core"
version = "0.2.18"
edition = "2024"
rust-version = "1.88.0"

[[bin]]
name = "bekk-core"
path = "src/main.rs"

[dependencies]
rustic_core = "0.11"
rustic_backend = "0.6"
bytesize = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
